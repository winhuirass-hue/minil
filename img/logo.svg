    <text transform="matrix(1.5 -0.1 0 1.5 340 50)" x="0" y="0">0</text>

    <!-- середина -->
    <text transform="matrix(3 0.05 -0.05 3 300 150)" x="0" y="0">1</text>

    <!-- правий блок -->
    <text transform="matrix(3.2 -0.1 0.1 3.1 400 160)" x="0" y="0">1</text>
    <text transform="matrix(3.3 0.1 -0.1 3.2 480 170)" x="0" y="0">1</text>

  </g>

</svg>
