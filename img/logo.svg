<svg width="580"
     height="320"
     viewBox="0 0 580 320"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- CRT glow -->
    <filter id="crtGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- glitch -->
    <filter id="glitch">

      <feTurbulence type="fractalNoise"
                    baseFrequency="0.01"
                    numOctaves="2"
                    seed="5">

        <animate attributeName="baseFrequency"
                 values="0.01;0.03;0.01"
                 dur="0.18s"
                 repeatCount="indefinite"/>

      </feTurbulence>

      <feDisplacementMap in="SourceGraphic"
                         scale="6"/>

    </filter>

    <!-- scanlines -->
    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="2"
            fill="#000"
            opacity="0.15"/>

    </pattern>

  </defs>

  <!-- falling binary -->

  <g fill="#00ff66"
     opacity="0.08"
     font-family="monospace"
     font-size="16">

    <text x="40" y="-100">
      1011010011010110011010
      <animate attributeName="y"
               from="-100"
               to="420"
               dur="8s"
               repeatCount="indefinite"/>
    </text>

    <text x="120" y="-150">
      0101001101010010101001
      <animate attributeName="y"
               from="-150"
               to="420"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="220" y="-90">
      1010101100101011010101
      <animate attributeName="y"
               from="-90"
               to="420"
               dur="9s"
               repeatCount="indefinite"/>
    </text>

    <text x="380" y="-120">
      0101010101011010011010
      <animate attributeName="y"
               from="-120"
               to="420"
               dur="11s"
               repeatCount="indefinite"/>
    </text>

  </g>

  <!-- logo -->

  <g filter="url(#crtGlow)">

    <!-- RGB RED -->
    <g fill="#ff0033"
       opacity="0.35">

      <animateTransform
          attributeName="transform"
          type="translate"
          values="0,0;3,0;-2,1;0,0"
          dur="0.12s"
          repeatCount="indefinite"/>

      <text font-family="monospace"
            font-size="110"
            x="40"
            y="190">
        MiNIL
      </text>

    </g>

    <!-- RGB BLUE -->
    <g fill="#0099ff"
       opacity="0.35">

      <animateTransform
          attributeName="transform"
          type="translate"
          values="0,0;-3,0;2,-1;0,0"
          dur="0.12s"
          repeatCount="indefinite"/>

      <text font-family="monospace"
            font-size="110"
            x="40"
            y="190">
        MiNIL
      </text>

    </g>

    <!-- MAIN -->

    <g fill="#39ff14"
       filter="url(#glitch)">

      <animate attributeName="opacity"
               values="1;0.95;1;0.92;1"
               dur="0.10s"
               repeatCount="indefinite"/>

      <text font-family="monospace"
            font-size="110"
            x="40"
            y="190">
        MiNIL
      </text>

    </g>

  </g>

  <!-- subtitle -->

  <text x="290"
        y="245"
        text-anchor="middle"
        fill="#39ff14"
        font-family="monospace"
        font-size="14"
        letter-spacing="3">

    MINIMAL RUNTIME · MAXIMAL CONTROL

    <animate attributeName="opacity"
             values="1;0.7;1"
             dur="1.5s"
             repeatCount="indefinite"/>

  </text>

  <!-- signature -->

  <text x="290"
        y="275"
        text-anchor="middle"
        fill="#00ff66"
        opacity="0.8"
        font-family="monospace"
        font-size="12">

    MINIL_SIGNATURE = 0x1DB

  </text>

  <!-- screen tint -->

  <rect width="580"
        height="320"
        fill="#00ff00"
        opacity="0.02"/>

  <!-- scanlines -->

  <rect width="580"
        height="320"
        fill="url(#scanlines)"/>

</svg>
