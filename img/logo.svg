    <text transform="matrix(3.1 -0.1 0.1 3.1 120 60)" x="0" y="0">1</text>

    <!-- центр -->
    <text transform="matrix(2.8 0.2 -0.15 2.9 220 120)" x="0" y="0">1</text>

    <!-- 0 зверху (i dot) -->
