<svg width="580" height="320" viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="#111"/>

  <g fill="#00ff00" font-family="monospace" text-anchor="middle">

    <!-- лівий блок -->
